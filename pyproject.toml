[project]
name = "opskit"
version = "1.0.0"
description = "Reusable SRE/DevOps helpers: logging, retries, safety guards, multi-account AWS, K8s, validation checks"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "requests>=2.31"]

[project.optional-dependencies]
k8s = ["kubernetes>=29"]
metrics = ["prometheus_client>=0.20"]
dev = ["pytest>=8", "moto[ec2,s3,iam,sts]>=5", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
