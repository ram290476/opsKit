[project]
name = "opskit"
version = "1.0.0"
description = "Reusable SRE/DevOps helpers: logging, retries, safety guards, multi-account AWS, K8s, validation checks, access-log parsing"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "requests>=2.31"]

[project.scripts]
opsclient = "opsclient.cli:main"

[project.optional-dependencies]
k8s = ["kubernetes>=29"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
metrics = ["prometheus_client>=0.20"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "moto[ec2,s3,iam,sts]>=5", "openpyxl>=3.1", "fastapi>=0.110", "httpx>=0.27", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
